<!doctype html>
<html lang="es">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Detective de la Salud</title>
    <style>
      :root {
        color-scheme: light;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px)
      }

      body {
        margin: 0
      }

      img {
        max-width: 100%
      }

      [hidden] {
        display: none !important
      }

    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600&display=swap">
    <style>
      /* Layout: one centered column sized for a tablet, big touch targets, one task on screen at a time */
      :root {
        --bg: #EDF3F7;
        --surface: #FFFFFF;
        --surface-2: #F5F8FB;
        --ink: #18263A;
        --muted: #56677D;
        --line: #D3DEE8;
        --b1: #0F9A72;
        --b2: #8448D6;
        --b3: #2B76DB;
        --b4: #E07A12;
        --b5: #D6455D;
        --b6: #0E8FA8;
        --ok: #1C9455;
        --ok-soft: #DDF4E7;
        --err: #D3402F;
        --err-soft: #FBE3E0;
        --warn: #C98A00;
        --warn-soft: #FFF1CC;
        --focus: #2B76DB;
        --f-display: "Baloo 2", "Arial Rounded MT Bold", system-ui, sans-serif;
        --f-body: "Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
        --r: 18px;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --bg: #0F1823;
          --surface: #182432;
          --surface-2: #1F2D3D;
          --ink: #E7EEF6;
          --muted: #9FB0C3;
          --line: #2C3D50;
          --b1: #34C597;
          --b2: #B183F2;
          --b3: #6AA6F5;
          --b4: #F5A04A;
        --b5: #F07A8E;
        --b6: #4CC3D9;
          --ok: #44C783;
          --ok-soft: #173A2A;
          --err: #F2766A;
          --err-soft: #43211F;
          --warn: #F2C14E;
          --warn-soft: #3D3214;
          --focus: #6AA6F5;
        }
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0F1823;
        --surface: #182432;
        --surface-2: #1F2D3D;
        --ink: #E7EEF6;
        --muted: #9FB0C3;
        --line: #2C3D50;
        --b1: #34C597;
        --b2: #B183F2;
        --b3: #6AA6F5;
        --b4: #F5A04A;
        --b5: #F07A8E;
        --b6: #4CC3D9;
        --ok: #44C783;
        --ok-soft: #173A2A;
        --err: #F2766A;
        --err-soft: #43211F;
        --warn: #F2C14E;
        --warn-soft: #3D3214;
        --focus: #6AA6F5;
      }

      * {
        box-sizing: border-box
      }

      html,
      body {
        min-height: 100%
      }

      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--f-body);
        font-size: 19px;
        line-height: 1.55;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        -webkit-tap-highlight-color: transparent;
      }

      .wrap {
        max-width: 780px;
        margin: 0 auto;
        padding-block: 28px 64px;
        display: flex;
        flex-direction: column;
        gap: 24px
      }

      h1,
      h2,
      h3 {
        font-family: var(--f-display);
        line-height: 1.1;
        margin: 0;
        text-wrap: balance
      }

      h1 {
        font-size: clamp(2.2rem, 6vw, 3.2rem);
        font-weight: 800
      }

      h2 {
        font-size: 1.7rem;
        font-weight: 700
      }

      p {
        margin: 0
      }

      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        touch-action: manipulation
      }

      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px
      }

      .muted {
        color: var(--muted)
      }

      /* buttons */
      .btn {
        border: 0;
        border-radius: 999px;
        padding: 14px 26px;
        min-height: 56px;
        font-weight: 600;
        font-size: 1.05rem;
        background: var(--ink);
        color: var(--bg);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px
      }

      .btn.alt {
        background: var(--surface);
        color: var(--ink);
        box-shadow: inset 0 0 0 2px var(--line)
      }

      .btn[disabled] {
        opacity: .35;
        cursor: not-allowed
      }

      .btn:active:not([disabled]) {
        transform: translateY(1px)
      }

      .linkbtn {
        background: none;
        border: 0;
        color: var(--muted);
        text-decoration: underline;
        padding: 12px;
        min-height: 48px;
        font-size: .95rem
      }

      /* home */
      .hero {
        display: flex;
        flex-direction: column;
        gap: 10px
      }

      .hero p {
        max-width: 60ch
      }

      .modes {
        display: flex;
        flex-wrap: wrap;
        gap: 12px
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px
      }

      @media (max-width:640px) {
        .grid {
          grid-template-columns: 1fr
        }
      }

      .bcard {
        background: var(--surface);
        border-radius: var(--r);
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        border-top: 8px solid var(--c)
      }

      /* mapa mental */
      .mmap { position: relative; display: grid; grid-template-columns: 1fr auto 1fr; gap: 18px 56px; align-items: center; }
      .mlines { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
      .mcol { display: flex; flex-direction: column; gap: 14px; position: relative; }
      .mcenter { position: relative; background: var(--c); color: #fff; font-family: var(--f-display); font-weight: 800; font-size: 1.45rem;
        line-height: 1.15; text-align: center; padding: 22px 18px; border-radius: 28px; max-width: 200px; text-wrap: balance;
        display: flex; flex-direction: column; align-items: center; gap: 6px; box-shadow: 0 6px 18px color-mix(in srgb, var(--c) 35%, transparent); }
      .mico { font-size: 2.2rem; }
      .mnode { position: relative; display: flex; gap: 10px; align-items: center; text-align: left; border: 3px solid var(--m); border-radius: 18px;
        padding: 10px 12px; background: color-mix(in srgb, var(--m) 13%, var(--surface)); transition: opacity .2s, transform .2s; }
      .mnode img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; flex: none; }
      .mtxt { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
      .mt { font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; line-height: 1.15; color: var(--ink); }
      .mk { display: flex; flex-wrap: wrap; gap: 5px; }
      .mk span { font-size: .85rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: color-mix(in srgb, var(--m) 26%, var(--surface)); color: var(--ink); }
      .mnode { flex-wrap: wrap; cursor: pointer; }
      .msay { display: block; margin-top: 8px; }
      .mtxt { flex: 1; }
      .mt { hyphens: auto; -webkit-hyphens: auto; overflow-wrap: anywhere; }
      .mexp { flex-basis: 100%; display: none; font-size: 1rem; line-height: 1.45; color: var(--ink); background: var(--surface); border-radius: 10px; padding: 8px 10px; }
      .mnode.on .mexp { display: block; }
      .mmap.focus .mnode:not(.on) { opacity: .3; }
      .mmap.focus .mnode.on { transform: scale(1.04); box-shadow: 0 8px 22px color-mix(in srgb, var(--m) 40%, transparent); }
      @media (max-width: 700px) {
        .mmap { grid-template-columns: 1fr; padding-left: 26px; }
        .mcenter { order: -1; max-width: none; margin-left: -26px; }
      }
      @media (prefers-reduced-motion: reduce) { .mnode { transition: none; } }

      /* actividad de arrastrar a cajas */
      .pool { display: flex; flex-wrap: wrap; gap: 10px; min-height: 52px; }
      .bank .chip { touch-action: none; }
      .bank.dragmode .chip.used { display: none; }
      .pgrid { display: grid; grid-template-columns: 1fr auto; gap: 12px 16px; align-items: center; background: var(--surface-2);
        border-radius: 14px; padding: 16px 20px; font-size: 1.2rem; }
      .pgrid .slot { min-width: 170px; margin: 0; }
      @media (max-width: 560px) { .pgrid { grid-template-columns: 1fr; } }
      .schip { touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
      .schip.sel { box-shadow: inset 0 0 0 3px var(--c); }
      .schip.dragging { opacity: .3; }
      .schip.ok { background: var(--ok-soft); box-shadow: inset 0 0 0 2px var(--ok); cursor: default; }
      .schip.bad { background: var(--err-soft); box-shadow: inset 0 0 0 2px var(--err); }
      .ghost { position: fixed; z-index: 50; pointer-events: none; margin: 0; box-shadow: 0 10px 24px rgba(0, 0, 0, .22); }
      .sboxes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      @media (max-width: 560px) { .sboxes { grid-template-columns: 1fr; } }
      .sbox { border: 3px dashed var(--line); border-radius: 16px; padding: 14px; min-height: 220px; display: flex; flex-direction: column; gap: 10px; }
      .sbox.over { border-color: var(--c); background: color-mix(in srgb, var(--c) 10%, transparent); }
      .sbox h3 { font-size: 1.4rem; }
      .sitems { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }

      /* actividad de unir parejas */
      .pairs { display: grid; grid-template-columns: 3fr 2fr; gap: 14px; align-items: start; }
      .pcol { display: flex; flex-direction: column; gap: 10px; }
      .pitem { text-align: left; position: relative; }
      .pitem.sel { box-shadow: inset 0 0 0 3px var(--c); background: color-mix(in srgb, var(--c) 28%, var(--surface)); }
      .pitem.ok { background: var(--ok-soft); box-shadow: inset 0 0 0 2px var(--ok); cursor: default; color: var(--ink); }
      .pitem.ok::after { content: attr(data-n); position: absolute; top: -8px; right: -8px; width: 24px; height: 24px; border-radius: 50%;
        background: var(--ok); color: #fff; font-size: .8rem; display: grid; place-items: center; }
      .pitem.bad { background: var(--err-soft); box-shadow: inset 0 0 0 2px var(--err); }

      .okflash { margin: 0; text-align: center; font-size: 4rem; line-height: 1; color: var(--ok); font-weight: 800; }

      .bphoto {
        width: 100%;
        aspect-ratio: 16 / 10;
        object-fit: cover;
        border-radius: 12px;
        display: block;
      }

      .bcard .top {
        display: flex;
        gap: 12px;
        align-items: flex-start
      }

      .bcard .ico {
        font-size: 2rem;
        line-height: 1
      }

      .bcard h3 {
        font-size: 1.35rem
      }

      .bcard .num {
        font-size: .9rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums
      }

      .dots {
        display: flex;
        flex-wrap: wrap;
        gap: 6px
      }

      .dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        box-shadow: inset 0 0 0 2px var(--line);
        background: transparent
      }

      .dot.l1 {
        background: color-mix(in srgb, var(--c) 30%, transparent);
        box-shadow: none
      }

      .dot.l2 {
        background: color-mix(in srgb, var(--c) 62%, transparent);
        box-shadow: none
      }

      .dot.l3 {
        background: var(--c);
        box-shadow: none
      }

      .bcard .btn {
        background: var(--c);
        color: #fff;
        align-self: flex-start;
        margin-top: auto
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        font-size: .85rem;
        color: var(--muted);
        --c: var(--ink)
      }

      .legend span {
        display: inline-flex;
        gap: 6px;
        align-items: center
      }

      .legend .dot {
        width: 14px;
        height: 14px
      }

      /* play */
      .bar {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap
      }

      .bar .linkbtn {
        margin-left: -12px
      }

      .steps {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 6px;
        margin-left: auto
      }

      .steps i {
        width: 28px;
        height: 8px;
        border-radius: 4px;
        background: var(--line)
      }

      .steps i.done {
        background: var(--ok)
      }

      .steps i.miss {
        background: var(--err)
      }

      .steps i.now {
        background: var(--ink)
      }

      .qcard {
        background: var(--surface);
        border-radius: var(--r);
        padding: clamp(20px, 4vw, 32px);
        display: flex;
        flex-direction: column;
        gap: 20px;
        border-top: 8px solid var(--c)
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center
      }

      .tag {
        font-size: .8rem;
        font-weight: 600;
        letter-spacing: .04em;
        text-transform: uppercase;
        padding: 5px 12px;
        border-radius: 999px;
        background: var(--surface-2);
        color: var(--muted)
      }

      .lvl {
        color: #fff
      }

      .lvl.n1 {
        background: var(--ok)
      }

      .lvl.n2 {
        background: var(--warn);
        color: #1d1500
      }

      .lvl.n3 {
        background: var(--err)
      }

      .question {
        font-family: var(--f-display);
        font-size: clamp(1.7rem, 4.4vw, 2.2rem);
        font-weight: 700;
        line-height: 1.15
      }

      .howto {
        font-size: .95rem;
        color: var(--muted)
      }

      .sentence {
        white-space: pre-line;
        font-size: 1.25rem;
        line-height: 2.5;
        background: var(--surface-2);
        border-radius: 14px;
        padding: 16px 20px
      }

      .slot {
        display: inline-block;
        min-width: 110px;
        min-height: 46px;
        padding: 4px 14px;
        margin: 0 2px;
        vertical-align: middle;
        line-height: 1.6;
        border: 0;
        border-radius: 12px;
        background: var(--surface);
        box-shadow: inset 0 0 0 2px var(--line), 0 0 0 0 transparent;
        font-weight: 600;
        font-size: 1.1rem
      }

      .slot.empty {
        border-bottom: 3px dashed var(--muted)
      }

      .slot.sel {
        box-shadow: inset 0 0 0 3px var(--c)
      }

      .slot.ok,
      .gap.ok {
        background: var(--ok-soft);
        box-shadow: inset 0 0 0 2px var(--ok)
      }

      .slot.bad,
      .gap.bad {
        background: var(--err-soft);
        box-shadow: inset 0 0 0 2px var(--err);
        text-decoration: line-through
      }

      .bank {
        display: flex;
        flex-wrap: wrap;
        gap: 10px
      }

      .chip {
        border: 0;
        border-radius: 12px;
        padding: 10px 18px;
        min-height: 52px;
        font-weight: 600;
        font-size: 1.1rem;
        background: color-mix(in srgb, var(--c) 16%, var(--surface));
        box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--c) 45%, transparent)
      }

      .chip.used {
        visibility: hidden
      }

      .gap {
        font: inherit;
        font-weight: 600;
        font-size: 1.15rem;
        color: var(--ink);
        border: 0;
        border-radius: 12px;
        padding: 6px 10px;
        min-height: 46px;
        margin: 0 2px;
        vertical-align: middle;
        background: var(--surface);
        box-shadow: inset 0 0 0 2px var(--line);
        max-width: 100%
      }

      .gap::placeholder {
        color: var(--muted);
        letter-spacing: .12em;
        font-weight: 500
      }

      textarea {
        width: 100%;
        min-height: 190px;
        font: inherit;
        font-size: 1.2rem;
        line-height: 1.6;
        color: var(--ink);
        background: var(--surface-2);
        border: 0;
        border-radius: 14px;
        padding: 16px 18px;
        box-shadow: inset 0 0 0 2px var(--line);
        resize: vertical
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center
      }

.bubble {
        position: relative; margin-top: 8px; background: var(--surface-2); border: 2px solid var(--c);
        border-radius: 18px; padding: 14px 18px; font-size: 1.1rem;
      }
      .bubble::before {
        content: ""; position: absolute; top: -10px; left: 32px; width: 16px; height: 16px; background: var(--surface-2);
        border-left: 2px solid var(--c); border-top: 2px solid var(--c); transform: rotate(45deg);
      }
      .truco {
        background: var(--warn-soft);
        border-radius: 14px;
        padding: 14px 18px;
        font-size: 1.05rem
      }

      .fb {
        border-radius: var(--r);
        padding: 20px 22px;
        display: flex;
        flex-direction: column;
        gap: 12px
      }

      .fb.good {
        background: var(--ok-soft)
      }

      .fb.bad {
        background: var(--err-soft)
      }

      .fb .msg {
        font-family: var(--f-display);
        font-size: 1.6rem;
        font-weight: 700;
        line-height: 1.15
      }

      .fb .book {
        font-size: 1.15rem
      }

      .fb .book b {
        font-weight: 600
      }

      .fb .label {
        font-size: .8rem;
        text-transform: uppercase;
        letter-spacing: .06em;
        font-weight: 600;
        color: var(--muted)
      }

      mark {
        border-radius: 6px;
        padding: 0 4px;
        font-weight: 600;
        color: var(--ink)
      }

      mark.got {
        background: color-mix(in srgb, var(--ok) 30%, transparent)
      }

      mark.miss {
        background: color-mix(in srgb, var(--err) 30%, transparent)
      }

      /* home: recorrido y progreso por bloque */
      .flow {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        font-size: .95rem;
        color: var(--muted)
      }

      .flow b {
        color: var(--ink)
      }

      .prog {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 6px 10px;
        align-items: center;
        font-size: .88rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums
      }

      .meter {
        height: 10px;
        border-radius: 5px;
        background: var(--surface-2);
        overflow: hidden;
        box-shadow: inset 0 0 0 1px var(--line)
      }

      .meter i {
        display: block;
        height: 100%;
        background: var(--c)
      }

      .bbtns {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: auto
      }

      .bcard .bbtns .btn {
        margin-top: 0;
        flex: 1 1 auto;
        padding: 8px 8px;
        min-height: 46px;
        font-size: .88rem;
        gap: 4px;
        white-space: nowrap
      }

      .bcard .btn.alt {
        background: var(--surface);
        color: var(--ink);
        box-shadow: inset 0 0 0 2px var(--c)
      }

      .rec {
        font-size: .85rem;
        color: var(--muted)
      }

      /* tarjetas flash */
      .fcard {
        background: var(--surface);
        border-radius: var(--r);
        padding: clamp(22px, 4vw, 34px);
        display: flex;
        flex-direction: column;
        gap: 18px;
        border-top: 8px solid var(--c);
        min-height: 340px
      }

      .flipbtn {
        margin-top: auto;
        align-self: center
      }

      @media (prefers-reduced-motion: no-preference) {
        .fcard.flip {
          animation: flip .34s ease-in-out
        }

        @keyframes flip {
          0% {
            transform: scaleX(.02)
          }

          100% {
            transform: scaleX(1)
          }
        }
      }

      .qsmall {
        font-family: var(--f-display);
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--muted);
        line-height: 1.2
      }

      .answer {
        white-space: pre-line;
        font-size: 1.3rem;
        line-height: 1.75
      }

      .answer mark {
        background: color-mix(in srgb, var(--c) 26%, transparent)
      }

      .tapme {
        margin-top: auto;
        text-align: center;
        color: var(--muted);
        font-size: 1rem
      }

      .cover {
        border: 0;
        font: inherit;
        font-weight: 600;
        padding: 0 10px;
        min-height: 40px;
        border-radius: 8px;
        vertical-align: baseline;
        background: var(--c);
        color: transparent;
        user-select: none
      }

      .cover.open {
        background: color-mix(in srgb, var(--c) 26%, transparent);
        color: var(--ink)
      }

      .imgs {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center
      }

      .imgs img {
        max-width: 100%;
        max-height: 300px;
        width: auto;
        height: auto;
        border-radius: 12px
      }

      .rate {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px
      }

      .rate .btn {
        width: 100%
      }

      .rate.one {
        grid-template-columns: 1fr
      }

      .btn.again {
        background: var(--warn-soft);
        color: var(--ink)
      }

      .btn.know {
        background: var(--ok);
        color: #fff
      }

      function lev(a, b) {
        const m = a.length, n = b.length; if (Math.abs(m - n) > 1) return 2; const d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);

        const drag = !round.exam, U = drag ? 1 : 3;
        // Unir parejas: cada definición en su línea, con su hueco al lado.
        const toks = q.pairs ? q.pairs.flatMap((p, i) => [{ t: 'x', s: (i ? '\n' : '') + p[0] + '  →  ' }, { t: 'b', i, ans: p[1], g: null }]) : parse(q.a);
        const blanks = toks.filter(t => t.t === 'b');
        const steps = round.cards.map((c, i) => `<i class="${i < round.idx ? (round.results[i] ? 'done' : 'miss') : i === round.idx ? 'now' : ''}"></i>`).join('');
        $('#app').innerHTML = `
    <div class="bar"><button class="linkbtn" id="exit">← Salir</button><div class="steps" aria-label="Pregunta ${round.idx + 1} de ${round.cards.length}">${steps}</div></div>
    <article class="qcard" style="--c:${b.c}">
      <div class="facehead"><div class="tags"><span class="tag">${b.icon} Bloque ${b.id}</span>${round.exam ? '<span class="tag lvl n3">Simulacro</span>' : ''}</div>${canSpeak ? '<button class="say" id="say">🔊 Escuchar</button>' : ''}</div>
      <h2 class="question">${q.pairs ? q.q.split('?')[0] + '?' : q.q}</h2>
      ${drag ? '' : `<p class="howto">${LVL[U].how}</p>`}
      <div id="work"></div>
      <div class="actions"><button class="btn" id="check" ${drag ? 'hidden' : ''}>Comprobar</button>
        ${q.truco && !round.exam ? '<button class="btn alt" id="tip">💡 Truco</button>' : ''}</div>
      <div id="tipbox"></div>
    </article>
    <div id="fb"></div>`;
        $('#exit').onclick = showHome;
        if ($('#say')) $('#say').onclick = () => speak(q.q);
        if ($('#tip')) $('#tip').onclick = () => { $('#tipbox').innerHTML = `<p class="truco">💡 ${q.truco}</p>`; $('#tip').remove(); };
        const work = $('#work');
        let getAnswer, mistakes = 0;

        if (U === 1) {
          // Cada palabra se comprueba al soltarla: si va en ese hueco se queda en verde; si no, el hueco parpadea en rojo y la palabra vuelve abajo.
          // Palabras de relleno: solo si hay que colocar una única palabra (entonces se añade otra que no va).
          const used = new Set(), filled = blanks.map(() => null);
          const nOthers = (q.sort || q.pairs || blanks.length > 1) ? 0 : 1;
          const others = [...shuffle(Q.filter(o => o.b === q.b && o.id !== q.id)), ...shuffle(Q.filter(o => o.b !== q.b))]
            .flatMap(blanksOf).map(x => x.ans)
            .filter((v, i, a) => a.indexOf(v) === i && !blanks.some(bl => norm(bl.ans) === norm(v))).slice(0, nOthers);
          const chips = shuffle([...blanks.map(x => x.ans), ...others]);
          let sel = 0;
          // En una lista (mismo grupo) vale cualquier palabra del grupo que aún no esté colocada.
          const accepts = (i, word) => {
            const bl = blanks[i];
            if (!bl.g) return match(word, bl.ans, false);
            const left = blanks.filter(x => x.g === bl.g).map(x => x.ans);
            blanks.forEach((x, j) => { if (x.g === bl.g && filled[j] !== null) { const p = left.findIndex(a => match(chips[filled[j]], a, false)); if (p >= 0) left.splice(p, 1); } });
            return left.some(a => match(word, a, false));
          };
          const put = (k, i) => {
            if (i < 0 || filled[i] !== null || used.has(k)) return;
            if (accepts(i, chips[k])) {
              filled[i] = k; used.add(k); sel = filled.indexOf(null); render();
              if (sel < 0) setTimeout(() => $('#check').click(), 400);
            } else {
              mistakes++;
              const el = work.querySelector(`.slot[data-i="${i}"]`);
              if (el) { el.classList.add('bad'); setTimeout(() => el.classList.remove('bad'), 600); }
            }
          };
          const render = () => {
            const slot = t => `<button class="slot ${filled[t.i] === null ? 'empty' : 'ok'} ${sel === t.i ? 'sel' : ''}" data-i="${t.i}" ${filled[t.i] !== null ? 'disabled' : ''} aria-label="Hueco ${t.i + 1}">${filled[t.i] === null ? '&nbsp;' : esc(chips[filled[t.i]])}</button>`;
            work.innerHTML = `${q.pairs
              ? `<div class="pgrid">${blanks.map(t => `<span class="pdef">${esc(q.pairs[t.i][0])}</span>${slot(t)}`).join('')}</div>`
              : `<p class="sentence">${toks.map(t => t.t === 'x' ? esc(t.s) : slot(t)).join('')}</p>`}
        <div class="bank dragmode">${chips.map((c, k) => `<button class="chip ${used.has(k) ? 'used' : ''}" data-c="${k}">${esc(c)}</button>`).join('')}</div>`;
            work.querySelectorAll('.slot').forEach(s => s.onclick = () => { sel = +s.dataset.i; render(); });
            work.querySelectorAll('.bank .chip').forEach(c => {
              c.onclick = () => put(+c.dataset.c, sel);
              if (!used.has(+c.dataset.c)) c.addEventListener('pointerdown', e => dragChip(e, c));
            });
          };
          // Arrastrar una palabra hasta un hueco.
          const dragChip = (e, c) => {
            e.preventDefault();
            const k = +c.dataset.c, r = c.getBoundingClientRect(), ox = e.clientX - r.left, oy = e.clientY - r.top, sx = e.clientX, sy = e.clientY;
            let ghost = null, over = null;
            const slotAt = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest('.slot.empty'); };
            const mv = ev => {
              if (!ghost) {
                if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 8) return;
                ghost = c.cloneNode(true); ghost.classList.add('ghost'); ghost.style.width = r.width + 'px';
                document.body.appendChild(ghost); c.classList.add('dragging');
              }
              ghost.style.left = (ev.clientX - ox) + 'px'; ghost.style.top = (ev.clientY - oy) + 'px';
              const s = slotAt(ev.clientX, ev.clientY);
              if (s !== over) { if (over) over.classList.remove('sel'); over = s; if (over) over.classList.add('sel'); }
            };
            const up = () => {
              document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
              if (!ghost) return; // un toque normal lo gestiona onclick
              ghost.remove(); c.classList.remove('dragging');
              if (over) { over.classList.remove('sel'); put(k, +over.dataset.i); }
            };
            document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
          };
          render();
          getAnswer = () => filled.map(k => chips[k]);
        }
        else if (U === 2) {
          const hint = s => s.split(' ').map(w => w[0] + '_'.repeat(Math.max(0, w.length - 1))).join(' ');
          work.innerHTML = `<p class="sentence">${toks.map(t => t.t === 'x' ? esc(t.s) :
            `<input class="gap" id="gap-${q.id}-${t.i}" data-i="${t.i}" placeholder="${esc(hint(t.ans))}" size="${t.ans.length + 2}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Hueco ${t.i + 1}">`).join('')}</p>`;
          const ins = [...work.querySelectorAll('.gap')];
          ins.forEach((inp, k) => inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (ins[k + 1]) ins[k + 1].focus(); else $('#check').click(); } }));
          getAnswer = () => ins.map(i => i.value);
        }
        else {
          const first = toks[0].t === 'x' ? toks[0].s.trimEnd() + ' ' : '';
          const starter = round.exam ? '' : first;
          work.innerHTML = `${starter ? `<p class="howto">Te dejamos el principio para arrancar ✏️</p>` : ''}
      <textarea id="ta-${q.id}" aria-label="Tu respuesta" autocapitalize="sentences" spellcheck="false">${esc(starter)}</textarea>`;
          getAnswer = () => $('textarea', work).value;
        }

        $('#check').onclick = () => {
          const ans = getAnswer(); let ok, bookHTML, extra = '';
          if (U < 3) {
            const res = grade(blanks, ans, U === 2);
            ok = res.every(Boolean) && !(drag && mistakes > 0);
            work.querySelectorAll('.slot,.gap').forEach(el => { const i = +el.dataset.i; el.classList.add(res[i] ? 'ok' : 'bad'); el.disabled = true; el.classList.remove('sel'); });
            work.querySelectorAll('.chip').forEach(c => c.disabled = true);
            bookHTML = toks.map(t => t.t === 'x' ? esc(t.s) : `<b>${esc(t.ans)}</b>`).join('');
          } else {
            const found = blanks.map(bl => keywordFound(ans, bl.ans));
            const n = found.filter(Boolean).length;
            ok = n / blanks.length >= 0.8;
            $('textarea', work).readOnly = true;
            bookHTML = toks.map(t => t.t === 'x' ? esc(t.s) : `<mark class="${found[t.i] ? 'got' : 'miss'}">${esc(t.ans)}</mark>`).join('');
            const missing = blanks.filter((_, i) => !found[i]).map(x => x.ans);
            extra = `<p>Palabras clave: <b>${n} de ${blanks.length}</b>${missing.length ? ` · Te faltan: <b>${missing.map(esc).join(', ')}</b>` : ' · ¡Están todas!'}</p>`;
          }
          round.results[round.idx] = ok;
          if (ok && !round.exam) { levels[q.id] = Math.max(lv(q), L); save(); }
          if (ok && round.exam) { levels[q.id] = 3; save(); }
          if (!ok && !round.exam && !card.retry) { round.cards.splice(Math.min(round.idx + 3, round.cards.length), 0, { q, level: L, retry: true }); }
          $('#check').remove(); if ($('#tip')) $('#tip').remove();
          const goNext = () => { round.idx++; round.idx < round.cards.length ? showCard() : showEnd(); };
          // Acierto en la práctica: un ✓ y a la siguiente, sin más texto.
          if (ok && !round.exam) { $('#fb').innerHTML = '<p class="okflash" aria-label="Correcto">✓</p>'; setTimeout(goNext, 800); return; }
          const last = round.idx === round.cards.length - 1;
          $('#fb').innerHTML = `<section class="fb ${ok ? 'good' : 'bad'}" aria-live="polite">
      <p class="msg">${ok ? pick(OK_MSG) : pick(BAD_MSG)}</p>${extra}
      <p class="label">Así lo dice el libro</p><p class="book">${bookHTML}</p>
      <div><button class="btn" id="next">${last ? 'Ver resultado' : 'Siguiente →'}</button></div></section>`;
          $('#next').onclick = goNext;
          $('#fb').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        };
        window.scrollTo(0, 0);
      }

      /* ===== Tarjetas flash =====
         Paquetes de 5 tarjetas en el orden del libro.
         Paso 1: lee la pregunta, gira y lee la respuesta literal ("Me la sé" / "Otra vez").
         Paso 2: la misma respuesta con las palabras clave tapadas; las dice y las destapa. */
      let deck = null;
      const byId = id => Q.find(q => q.id === id);
      // Todo el bloque es un único paquete, en el orden del libro.
      function packsOf(bloque) {
        return [Q.filter(q => q.b === bloque).map(q => q.id)];
      }
      function startCards(bloque, pi) {
        const packs = packsOf(bloque);
        if (pi === undefined) { pi = packs.findIndex(p => p.some(id => !learned[id])); if (pi < 0) pi = 0; }
        deck = { bloque, packs, pi, pack: packs[pi], pos: 0, phase: 'learn', ok: new Set() };
        showFlash();
      }
      function imgsHTML(id) {
        const l = IMG[id];
        return l ? `<div class="imgs">${l.map(n => `<img src="img/${n}.jpg" alt="Ilustración del libro" loading="lazy">`).join('')}</div>` : '';
      }
      function showFlash(flipped) {
        hush();
        const id = deck.pack[deck.pos], q = byId(id), b = BLOQUES[q.b - 1], toks = parse(q.a), learn = deck.phase === 'learn';
        const nav = `<div class="rate"><button class="btn alt" id="prev" ${deck.pos === 0 ? 'disabled' : ''}>← Anterior</button>
    <button class="btn alt" id="nextc" ${deck.pos === deck.pack.length - 1 ? 'disabled' : ''}>Siguiente →</button></div>`;
        const steps = deck.pack.map(p => `<i class="${deck.ok.has(p) ? 'done' : p === id ? 'now' : ''}"></i>`).join('');
        const tag = `<span class="tag">${b.icon} Bloque ${b.id}</span>`;
        const sayBtn = canSpeak ? `<button class="say" id="say">🔊 Escuchar</button>` : '';
        let html;
        // Actividad de arrastrar a cajas (sustituye a las dos caras y a las palabras tapadas).
        if (q.sort) {
          const items = shuffle(Object.entries(q.sort).flatMap(([box, l]) => l.map(t => ({ t, box }))));
          html = `<article class="fcard" style="--c:${b.c}">
      <div class="tags">${tag}</div>
      <h2 class="question">${q.q.split(':')[0]}:</h2>
      <div class="pool" id="pool">${items.map(it => `<button class="chip schip" data-box="${it.box}">${esc(it.t)}</button>`).join('')}</div>
      <div class="sboxes">${Object.keys(q.sort).map(n => `<div class="sbox" data-name="${n}"><h3>${n}</h3><div class="sitems"></div></div>`).join('')}</div>
    </article>
    <div class="rate one" id="rate" hidden><button class="btn know" id="know">✅ Me la sé</button></div>`;
        }
        // Actividad de unir parejas: toca una definición y luego su nombre (o al revés).
        else if (q.pairs) {
          const right = shuffle(q.pairs.map((p, i) => ({ t: p[1], i })));
          html = `<article class="fcard" style="--c:${b.c}">
      <div class="tags">${tag}</div>
      <h2 class="question">${q.q.split('?')[0]}?</h2>
      <div class="pairs">
        <div class="pcol">${q.pairs.map((p, i) => `<button class="chip pitem" data-side="l" data-i="${i}">${esc(p[0])}</button>`).join('')}</div>
        <div class="pcol">${right.map(r => `<button class="chip pitem" data-side="r" data-i="${r.i}">${esc(r.t)}</button>`).join('')}</div>
      </div>
    </article>
    <div class="rate one" id="rate" hidden><button class="btn know" id="know">✅ Me la sé</button></div>`;
        }
        // Paso 1. Cara A: el contenido del libro para leer. Cara B: la pregunta sobre ese contenido.
        else if (learn && !flipped) {
          html = `<article class="fcard" style="--c:${b.c}">
      <div class="facehead"><div class="tags">${tag}</div>${sayBtn}</div>
      <h2 class="question">${ttl(q.q)}</h2>
      <p class="answer">${toks.map(t => t.t === 'x' ? esc(t.s) : `<mark>${esc(t.ans)}</mark>`).join('')}</p>
      ${q.mas ? `<p class="bubble">${q.mas}</p>` : ''}
      ${imgsHTML(id)}
      ${q.truco ? `<p class="truco">💡 ${q.truco}</p>` : ''}
      <button class="btn alt flipbtn" id="flip">🔄 Dar la vuelta</button>
    </article>`;
        } else if (learn) {
          html = `<article class="fcard flip" style="--c:${b.c}">
      <div class="facehead"><div class="tags">${tag}</div>${sayBtn}</div>
      <h2 class="question">${q.q}</h2>
      <button class="btn alt flipbtn" id="flip">🔄 Dar la vuelta</button>
    </article>
    <div class="rate one"><button class="btn know" id="know">✅ Me la sé</button></div>`;
        } else {
          html = `<article class="fcard" style="--c:${b.c}">
      <div class="tags">${tag}</div>
      <h2 class="question">${q.q}</h2>
      <p class="answer">${toks.map(t => t.t === 'x' ? esc(t.s) : `<button class="cover" aria-label="Destapar palabra ${t.i + 1}">${esc(t.ans)}</button>`).join('')}</p>
    </article>
    <div class="actions" id="uncover"><button class="btn alt" id="openall">Destapar todo</button></div>
    <div class="rate" id="rate" hidden><button class="btn again" id="again">🔁 Me faltó alguna</button><button class="btn know" id="know">✅ ¡Las dije todas!</button></div>`;
        }
        $('#app').innerHTML = `<div class="bar"><button class="linkbtn" id="exit">← Salir</button>
    <div class="steps" aria-label="${deck.ok.size} de ${deck.pack.length} tarjetas">${steps}</div></div>${html}${nav}`;
        $('#prev').onclick = () => { deck.pos--; showFlash(); };
        $('#nextc').onclick = () => { deck.pos++; showFlash(); };
        $('#exit').onclick = showHome;
        if ($('#say')) $('#say').onclick = e => { e.stopPropagation(); speak(flipped ? q.q : ttl(q.q) + ' ' + plain(q.a)); };
        if ($('#flip')) $('#flip').onclick = () => showFlash(!flipped);
        if (q.sort) initSort();
        else if (q.pairs) initPairs();
        else if (!learn) {
          const covers = [...document.querySelectorAll('.cover')];
          const check = () => { if (covers.every(c => c.classList.contains('open'))) { $('#uncover').hidden = true; $('#rate').hidden = false; } };
          covers.forEach(c => c.onclick = () => { c.classList.add('open'); check(); });
          $('#openall').onclick = () => { covers.forEach(c => c.classList.add('open')); check(); };
        }
        // "Me la sé": pasa a la siguiente que aún no se sabe. "Otra vez": repite esta misma tarjeta desde el principio.
        if ($('#know')) $('#know').onclick = () => { deck.ok.add(id); nextFlash(); };
        if ($('#again')) $('#again').onclick = () => showFlash();
        window.scrollTo(0, 0);
      }
      // Arrastrar (dedo o ratón) cada palabra a su caja. También vale tocar la palabra y luego la caja.
      function initSort() {
        const pool = $('#pool'), boxes = [...document.querySelectorAll('.sbox')];
        let sel = null;
        const place = (chip, box) => {
          chip.classList.remove('sel'); sel = null;
          if (chip.dataset.box === box.dataset.name) {
            chip.classList.add('ok'); chip.disabled = true; box.querySelector('.sitems').appendChild(chip);
            if (!pool.querySelector('.schip')) { pool.hidden = true; $('#rate').hidden = false; }
          } else {
            chip.classList.add('bad'); setTimeout(() => chip.classList.remove('bad'), 700);
          }
        };
        const boxAt = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest('.sbox'); };
        pool.querySelectorAll('.schip').forEach(chip => chip.addEventListener('pointerdown', e => {
          if (chip.disabled) return;
          e.preventDefault();
          const r = chip.getBoundingClientRect(), ox = e.clientX - r.left, oy = e.clientY - r.top, sx = e.clientX, sy = e.clientY;
          let ghost = null, over = null;
          const mv = ev => {
            if (!ghost) {
              if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 8) return;
              ghost = chip.cloneNode(true); ghost.classList.add('ghost'); ghost.style.width = r.width + 'px';
              document.body.appendChild(ghost); chip.classList.add('dragging');
            }
            ghost.style.left = (ev.clientX - ox) + 'px'; ghost.style.top = (ev.clientY - oy) + 'px';
            over = boxAt(ev.clientX, ev.clientY); boxes.forEach(bx => bx.classList.toggle('over', bx === over));
          };
          const up = () => {
            document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
            boxes.forEach(bx => bx.classList.remove('over'));
            if (ghost) { ghost.remove(); chip.classList.remove('dragging'); if (over) place(chip, over); }
            else { pool.querySelectorAll('.sel').forEach(c => c.classList.remove('sel')); chip.classList.add('sel'); sel = chip; }
          };
          document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
        }));
        boxes.forEach(bx => bx.addEventListener('click', () => { if (sel) place(sel, bx); }));
      }

      function initPairs() {
        const items = [...document.querySelectorAll('.pitem')];
        let sel = null, n = 0;
        items.forEach(it => it.onclick = () => {
          if (it.disabled) return;
          if (!sel || sel.dataset.side === it.dataset.side) {
            items.forEach(x => x.classList.remove('sel')); it.classList.add('sel'); sel = it; return;
          }
          const a = sel; sel = null; a.classList.remove('sel');
          if (a.dataset.i === it.dataset.i) {
            n++;
            [a, it].forEach(x => { x.classList.add('ok'); x.disabled = true; x.dataset.n = n; });
            if (items.every(x => x.disabled)) $('#rate').hidden = false;
          } else {
            [a, it].forEach(x => { x.classList.add('bad'); setTimeout(() => x.classList.remove('bad'), 700); });
          }
        });
      }

      function nextFlash() {
        const n = deck.pack.length;
        for (let k = 1; k <= n; k++) { const p = (deck.pos + k) % n; if (!deck.ok.has(deck.pack[p])) { deck.pos = p; return showFlash(); } }
        hush();
        deck.pack.forEach(id => learned[id] = true); saveCards();
        const more = deck.pi + 1 < deck.packs.length;
        $('#app').innerHTML = `<section class="endcard"><p class="big">⭐</p>
    <h2>¡Bien!</h2>
    <div class="actions">${more ? '<button class="btn" id="more">Seguir 🃏</button>' : ''}
      <button class="btn ${more ? 'alt' : ''}" id="prac">✍️ Practicar</button><button class="btn alt" id="home">Inicio</button></div></section>`;
        confetti();
        if ($('#more')) $('#more').onclick = () => startCards(deck.bloque, deck.pi + 1);
        $('#prac').onclick = () => startRound(deck.bloque);
        $('#home').onclick = showHome;
        window.scrollTo(0, 0);
      }

      /* ===== Mapa mental =====
         Centro: el bloque. Ramas: una por tarjeta (título corto + palabras clave + dibujo del libro).
         Tocar una rama la resalta y apaga las demás. */
      const TIT = {
        '1a': 'La salud', '1c': 'Factores', '1e': 'La enfermedad', '1f': 'Tipos de enfermedades',
        'i1': 'Qué son', 'i2': 'Agentes infecciosos', 'i3': 'Por dónde entran', 'i4a': 'Contagiosas', 'i4b': 'No contagiosas',
        'g1': 'Bacterias', 'g2': 'Hongos', 'g3': 'Protozoos', 'g4': 'Virus',
        'n0': 'Qué son', 'n1': 'Cáncer', 'n2': 'Intoxicaciones', 'n3': 'Traumatismos', 'n4': 'Respiratorias', 'n5': 'Congénitas',
        'n6': 'Cardiovasculares', 'n7': 'Alergias', 'n8': 'Nutricionales', 'n9': 'Estado de ánimo', 'n9e': 'Ejemplos de estado de ánimo',
        'd1': 'Diagnóstico', 'd2': 'Síntomas', 'd3': 'Signos', 'd3e': 'Ejemplos de signos', 'd5': 'Medicamentos', 'd6': 'Antibióticos',
        'd7a': 'Analgésicos', 'd7b': 'Antiinflamatorios', 'd9': 'Cirugía', 'd10': 'Prevenir', 'd11': 'Vacunas',
        '4d': 'Sistema sanitario', '4e': 'Atención primaria y especializada'
      };
      // Explicación sencilla que sale al tocar cada rama del mapa.
      const EXP = {
        '1a': 'Tener salud es estar bien en todo: en el cuerpo (físico), en la mente (mental) y con los demás (social).',
        '1c': 'Tu salud depende de tu edad, de cómo vives (lo que comes, si haces deporte…), de dónde vives y de la sanidad pública.',
        '1e': 'Estar enfermo es cuando algo del cuerpo deja de funcionar bien durante un tiempo. La causa puede venir de dentro o de fuera.',

      };
      const MAPC = ['#E4572E', '#E8A10C', '#23A06A', '#2B8CC4', '#8E5CD9', '#D6457A', '#139E9E', '#6E9A0A', '#C2671D', '#5B6CD9'];
      function showMap(bloque) {
        round = null; deck = null; hush();
        const b = BLOQUES[bloque - 1];
        const br = Q.filter(q => q.b === bloque && !q.sort && !q.pairs).map((q, i) => ({
          t: TIT[q.id] || q.a.split(':')[0], img: IMG[q.id] && IMG[q.id][0], c: MAPC[i % MAPC.length], x: EXP[q.id],
          kws: [...new Set(blanksOf(q).map(x => x.ans))]
        }));
        const half = Math.ceil(br.length / 2);
        const node = (n, k) => `<div class="mnode" role="button" tabindex="0" data-k="${k}" style="--m:${n.c}">
          ${n.img ? `<img src="img/${n.img}.jpg" alt="">` : ''}
          <span class="mtxt"><span class="mt">${esc(n.t)}</span><span class="mk">${n.kws.map(w => `<span>${esc(w)}</span>`).join('')}</span></span>${n.x ? `<span class="mexp">${esc(n.x)}${canSpeak ? `<button class="say msay">🔊 Escuchar</button>` : ''}</span>` : ''}</div>`;
        $('#app').innerHTML = `<div class="bar"><button class="linkbtn" id="exit">← Salir</button></div>
    <div class="mmap" style="--c:${b.c}">
      <svg class="mlines" aria-hidden="true"></svg>
      <div class="mcol">${br.slice(0, half).map((n, i) => node(n, i)).join('')}</div>
      <div class="mcenter"><span class="mico">${b.icon}</span>${esc(b.nombre)}</div>
      <div class="mcol">${br.slice(half).map((n, i) => node(n, i + half)).join('')}</div>
    </div>`;
        $('#exit').onclick = showHome;
        const map = $('.mmap'), svg = $('.mlines'), center = $('.mcenter'), nodes = [...map.querySelectorAll('.mnode')];
        const draw = () => {
          const M = map.getBoundingClientRect(), C = center.getBoundingClientRect();
          svg.setAttribute('width', M.width); svg.setAttribute('height', M.height);
          // Con una sola columna (pantalla estrecha) las ramas cuelgan de una línea vertical a la izquierda.
          const stacked = getComputedStyle(map).gridTemplateColumns.split(' ').length < 3;
          svg.innerHTML = nodes.map((n, k) => {
            const N = n.getBoundingClientRect(), col = br[k].c, ny = N.top + N.height / 2 - M.top;
            let d;
            if (stacked) { const x = 6, y0 = C.bottom - M.top; d = `M${x} ${y0} L${x} ${ny - 14} Q${x} ${ny} ${x + 14} ${ny} L${N.left - M.left} ${ny}`; }
            else {
              const left = N.right < C.left, cx = (left ? C.left : C.right) - M.left, cy = C.top + C.height / 2 - M.top, nx = (left ? N.right : N.left) - M.left, mx = (cx + nx) / 2;
              d = `M${cx} ${cy} C${mx} ${cy} ${mx} ${ny} ${nx} ${ny}`;
            }
            return `<path d="${d}" stroke="${col}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
          }).join('');
        };
        draw();
        if (window.ResizeObserver) new ResizeObserver(draw).observe(map);
        map.querySelectorAll('img').forEach(im => im.addEventListener('load', draw));
        nodes.forEach((n, k) => {
          const toggle = () => {
            hush();
            const on = !n.classList.contains('on');
            nodes.forEach(x => x.classList.remove('on')); if (on) n.classList.add('on');
            map.classList.toggle('focus', on);
            draw();
          };
          n.onclick = toggle;
          n.onkeydown = e => { if (e.target === n && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggle(); } };
          const sb = n.querySelector('.msay');
          if (sb) sb.onclick = e => { e.stopPropagation(); speak(br[k].t + '. ' + br[k].x); };
        });
        window.scrollTo(0, 0);
      }

      /* ===== Final de ronda ===== */
      function showEnd() {
        const n = round.results.filter(Boolean).length, t = round.results.length;
        const title = round.exam ? `${n} de ${t}` : `${'⭐'.repeat(Math.max(1, Math.round(n / t * 3)))}`;
        // Practicar todo el tema: estrellas, confeti y otra ronda seguida, hasta que pulse Salir.
        if (!round.exam && round.bloque == null) {
          const r = round;
          $('#app').innerHTML = `<div class="bar"><button class="linkbtn" id="exit">← Salir</button></div>
    <section class="endcard"><p class="big">${title}</p></section>`;
          $('#exit').onclick = showHome;
          confetti();
          setTimeout(() => { if (round === r) startRound(null); }, 1800);
          window.scrollTo(0, 0);
          return;
        }
        $('#app').innerHTML = `<section class="endcard">
    <p class="big">${title}</p>
    <div class="actions"><button class="btn" id="again">${round.exam ? 'Otro simulacro' : 'Otra ronda'}</button><button class="btn alt" id="home">Inicio</button></div>
  </section>`;
        $('#again').onclick = () => round.exam ? startExam() : startRound(round.bloque);
        $('#home').onclick = showHome;
        confetti();
        window.scrollTo(0, 0);
      }

      // Confeti de un segundo para celebrar. No sale si la tablet tiene reducido el movimiento.
      function confetti() {
        if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const cv = document.createElement('canvas'), W = innerWidth, H = innerHeight, dpr = devicePixelRatio || 1;
        cv.width = W * dpr; cv.height = H * dpr;
        Object.assign(cv.style, { position: 'fixed', inset: '0', width: W + 'px', height: H + 'px', pointerEvents: 'none', zIndex: 60 });
        document.body.appendChild(cv);
        const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
        const cols = ['#E4572E', '#E8A10C', '#23A06A', '#2B8CC4', '#8E5CD9', '#D6457A'];
        const ps = Array.from({ length: 90 }, () => ({
          x: W / 2 + (Math.random() - .5) * 80, y: H * .35, vx: (Math.random() - .5) * 12, vy: -Math.random() * 12 - 4,
          s: 6 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[Math.floor(Math.random() * cols.length)]
        }));
        const t0 = performance.now();
        const tick = t => {
          const k = (t - t0) / 1300;
          ctx.clearRect(0, 0, W, H);
          if (k >= 1) return cv.remove();
          ctx.globalAlpha = 1 - k * k;
          ps.forEach(p => { p.vy += .45; p.x += p.vx; p.y += p.vy; p.r += p.vr;
            ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }

      showHome();
    </script>
